name: career_buddy_lms
description: "Career Buddy LMS mobile app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management, used consistently across the app.
  flutter_riverpod: ^3.4.3
  # HTTP client with interceptor support (timeouts, error mapping, auth headers).
  dio: ^5.11.1
  # Declarative routing with auth guards (redirect callbacks).
  go_router: ^17.3.0
  # Secure (Keychain/Keystore) storage for session/token data.
  flutter_secure_storage: ^11.1.1
  # The backend authenticates via Django session cookies today (verified against
  # users/views.py + users/forms.py), not a token API, so the HTTP client needs a
  # persisted cookie jar to behave like a browser across requests.
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  # Directory to persist the cookie jar to, so the Django session survives
  # app restarts instead of forcing a re-login every launch.
  path_provider: ^2.1.6
  # Matches the web app's font stack (Outfit body / Newsreader display), verified
  # in templates/base.html.
  google_fonts: ^8.2.1
  # Grammar's "Lesson slides" illustration (`subject_illustration`) is a
  # real SVG, generated server-side on every request — no existing
  # rendering dependency here handles vector images (confirmed: zero
  # SvgPicture/flutter_svg usage anywhere before this).
  flutter_svg: ^2.3.0
  record: ^7.1.1
  flutter_tts: ^4.2.5
  # ARIA/Buddy voice playback (`riya_bot.views.riya_tts`) returns real
  # pre-rendered Sarvam TTS audio bytes (base64 WAV), not text for
  # `flutter_tts` to synthesize — a genuine audio-file player is needed to
  # play them, which no existing dependency here provides (`flutter_tts` is
  # device-voice-synthesis only; `record` is capture-only).
  audioplayers: ^6.1.0
  # Employer Registration's optional company-logo upload
  # (`EmployerRegisterForm.company_logo`, `accounts_app/forms.py:31-34`).
  image_picker: ^1.2.0
  # Resume Parsing's resume upload (`career_app.views.resume_job_match`) —
  # picks an arbitrary PDF/DOCX/plain-text file, which `image_picker`
  # (images only) can't do.
  file_picker: ^13.1.0
  # Opens the public "Download Template" static .docx link in the device's
  # browser, and `mailto:`/`tel:` links on Candidate Search — see
  # `ResumeHistoryScreen`'s doc comment for the "View File" feature's
  # documented limitation. NOT used for local file:// opens — see
  # `open_file` below for why.
  url_launcher: ^6.3.1
  # Opens a locally-downloaded protected file (resume, certificate PDF,
  # candidates CSV) in the device's own viewer app. `url_launcher`'s
  # `launchUrl(Uri.file(...))` cannot do this safely: on a real device
  # targeting SDK 24+ (confirmed via `url_launcher_android`'s own native
  # source — it hands the raw `file://` URI straight to an
  # `ACTION_VIEW` Intent with no `FileProvider` wrapping), Android throws
  # `FileUriExposedException` the moment that Intent reaches another app,
  # which every automated test misses since none exercises the real native
  # call. `open_file` wraps the path through its own bundled `FileProvider`
  # (merged into the manifest automatically) and returns a typed
  # `OpenResult` instead of throwing an undiagnosable platform exception.
  open_file: ^3.5.11
  # Skill Up's 48 lesson pages (`static/001 Career Buddy/**/*.html`) are a
  # hand-built static mini-site, not Django templates/an API — the only
  # honest way to show their real content (not a re-authored summary) is
  # to load the real page, the same way the web's own in-page `<iframe>`
  # viewer does. See `SkillUpLessonScreen`'s doc comment.
  webview_flutter: ^4.13.0
  # Grammar's per-topic lesson video (`protected_media/subjectvideos/
  # <slug>.mp4`, session-cookie-gated, so it's fetched via the app's own
  # authenticated Dio client to a local temp file, then played from disk).
  video_player: ^2.9.2
  # Batch 9 — AI Mock Interview needs a live camera preview
  # (`resume_camera_verified`'s real requirement — the web self-attests via
  # `getUserMedia`; Flutter needs the native equivalent).
  camera: ^0.12.1
  # Batch 9 — on-device speech-to-text, the native-mobile equivalent of the
  # web's browser-only `SpeechRecognition` API. Used by the Timer exercise
  # type (`exercises.js`'s `initTimer()`) and Group Discussion (`gd.js`'s
  # live transcription of the user's spoken turn) — neither is "faked",
  # both genuinely capture real speech, just via the platform's native STT
  # instead of the browser's.
  speech_to_text: ^7.5.0
  # Batch 9 — Group Discussion's live AI-agent conversation is a real
  # Django Channels WebSocket (`ws/GD_app/<session_id>/`), not HTTP.
  web_socket_channel: ^3.0.3
  # Phase 3 — Subscription checkout. The real web page
  # (`templates/pro.html`) drives Razorpay's own Standard Checkout JS widget
  # (`new Razorpay(options); .open()`) with `key_id`/`order_id`/`amount`/
  # `prefill`/a success callback — all fields the server already returns
  # from `create_razorpay_order`. This is the official package (published
  # by Team Razorpay) wrapping the same native Android/iOS Checkout SDKs
  # behind that identical options shape — see
  # `docs/PHASE_3_SUBSCRIPTION_DISCOVERY.md` §5 for the alternatives
  # considered and why this was chosen. It only ever relays the
  # server-returned order details and echoes back Razorpay's own callback
  # for server verification — never given an amount/plan to compute itself.
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lets W020's mock-test controller test drive its client-side exam timer
  # (a real `Timer.periodic`) deterministically instead of waiting out real
  # wall-clock minutes.
  fake_async: ^1.3.3

  # Lets the Grammar video-viewer tests fake `video_player`'s platform
  # channel (`FakeVideoPlayerPlatform` in `test/features/grammar/
  # grammar_test_doubles.dart`) — otherwise a transitive-only dependency.
  video_player_platform_interface: ^6.9.0

  # Lets the protected-media/certificate/CSV download controller tests fake
  # `open_file`'s platform channel (`FakeOpenFilePlatform` in
  # `test/support/fake_open_file_platform.dart`) so the real
  # `ResultType.noAppToOpen` case (confirmed live on a physical device with
  # no DOCX viewer installed) is reachable without a registered platform
  # channel — otherwise a transitive-only dependency.
  open_file_platform_interface: ^1.0.3
  # Same reasoning, for `path_provider`'s platform channel
  # (`FakePathProviderPlatform` in `test/support/fake_path_provider_platform
  # .dart`) — otherwise a transitive-only dependency.
  path_provider_platform_interface: ^2.1.2

  # Lets the Group Discussion WebSocket-service test build a fake
  # `WebSocketChannel` (`web_socket_channel` extends `StreamChannelMixin`)
  # wired directly over a plain `StreamController` instead of a real socket
  # — otherwise a transitive-only dependency (of `web_socket_channel`).
  stream_channel: ^2.1.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Web assets copied verbatim from the (read-only) Django project's
  # `static/images/` — see `docs/UI_PARITY_MASTER_AUDIT.md` §7 Batch 5A for
  # which web template/CSS rule each one backs. The Django source files
  # themselves were never modified, only copied.
  assets:
    - assets/images/job_seekers.png
    - assets/images/clients.png
    - assets/images/student_learning.png
    - assets/images/student_job_applying.png
    - assets/images/Ai_Robot.png
    - assets/images/employer_hiring.png
    - assets/images/employer_interview.png
    - assets/images/template_modern_professional.png
    - assets/images/template_executive_tech.png
    - assets/images/template_minimalist_career.png
    # Phase 37 — the real brand mark (`static/img/logo-mark*.png`), replacing
    # the generic `Icons.school_outlined` placeholder on the landing page's
    # top bar/footer. `logo-mark.png` carries its own navy background (for a
    # white/light surface); `logo-mark-light.png` is the bare gold mark with
    # no background (for a navy/dark surface) — matching exactly how the
    # updated web itself chooses between the two (`site_nav.html` vs
    # `base.html`/`landing.html`'s footer).
    - assets/images/logo-mark.png
    - assets/images/logo-mark-light.png
    # Batch 7 — Grammar's 9 topics, extracted verbatim (via a read-only
    # `ast.literal_eval` script, never Django code execution) from
    # `subject_views.py`'s own `SUBJECT_TOPIC_CARDS`/`SUBJECT_TOPICS`/
    # `TOPIC_EMOJI` constants — the exact real content, not re-authored.
    # See `docs/UI_PARITY_MASTER_AUDIT.md` §7 Batch 7 for how it was made.
    - assets/data/grammar_data.json
    # Phase 43 — the real "Choose Your Path" department/role catalogs.
    # `it_departments.json` is copied byte-for-byte from the real
    # `static/data/it_departments.json` the web itself fetches
    # (`landing.html:6742`'s `data-src`). `nonit_departments.json` is the
    # Non-IT equivalent — on the real web this data is inline JS, not a
    # separate file, so this copy was produced by extracting the exact
    # `var DEPTS = [...]` literal from `landing.html` and evaluating it with
    # Node (never re-authored by hand) — see
    # `docs/PHASE_43_IT_NONIT_CAREER_BROWSING_REPORT.md` for the exact
    # extraction method.
    - assets/data/it_departments.json
    - assets/data/nonit_departments.json
    # Phase 47 — the real Non-IT Skill Up curriculum (`static/data/
    # nonit_departments.json`, `index.html:3886`'s `data-src` for the
    # `#depth-nonit` section). Copied byte-for-byte from that file, which is
    # NOT the same file as the Phase 43 asset above despite the identical
    # real-web filename: that one is extracted from `landing.html`'s inline
    # `DEPTS` literal for career-path browsing and has no lesson link; this
    # one is the dedicated Skill Up data source and adds a 3rd array element
    # per role — the relative path to that role's lesson page (`initNonIt()`,
    # `r.course`). Kept under a distinct asset name to avoid confusing the
    # two. See `docs/PHASE_47_NONIT_SKILLUP_CONTENT_PARITY_REPORT.md`.
    - assets/data/nonit_skillup_departments.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
